<title>Location Dashboard – SJKVY/PMKVY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#111}
/* HEADER */
.hdr{background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.hdr h1{font-size:18px;font-weight:700}
.hdr p{font-size:11px;opacity:.7;margin-top:3px}
/* SELECTOR */
.sel-bar{background:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.08);position:sticky;top:0;z-index:50}
.sel-bar label{font-size:13px;font-weight:600;color:#555}
.sel-bar select{padding:7px 12px;border:2px solid #0f3460;border-radius:7px;font-size:13px;font-weight:600;color:#0f3460;min-width:250px;cursor:pointer}
.dist-badge{background:#0f3460;color:#fff;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;display:none}
/* MAIN */
.main{padding:18px 24px;max-width:1400px;margin:0 auto}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.kpi{background:#fff;border-radius:10px;padding:14px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.06);border-top:4px solid #ccc}
.kpi.c-blue{border-color:#2196f3}.kpi.c-teal{border-color:#009688}.kpi.c-green{border-color:#4caf50}
.kpi.c-purple{border-color:#9c27b0}.kpi.c-lime{border-color:#8bc34a}.kpi.c-red{border-color:#f44336}
.kv{font-size:26px;font-weight:800;margin:4px 0}
.kv.c-blue{color:#2196f3}.kv.c-teal{color:#009688}.kv.c-green{color:#4caf50}
.kv.c-purple{color:#9c27b0}.kv.c-lime{color:#8bc34a}.kv.c-red{color:#f44336}
.kl{font-size:10px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
/* ALERTS */
.sec-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:18px}
.alert{border-radius:9px;padding:12px 14px;display:flex;gap:10px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.alert.high{background:#fff3f3;border-left:4px solid #e53935}
.alert.medium{background:#fff8e1;border-left:4px solid #fb8c00}
.alert.info{background:#e3f2fd;border-left:4px solid #1e88e5}
.alert-icon{font-size:18px;line-height:1.2}
.alert-cat{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.alert-cat.high{color:#c62828}.alert-cat.medium{color:#e65100}.alert-cat.info{color:#1565c0}
.alert-msg{color:#333;margin-top:2px;line-height:1.45}
/* AI PANEL */
.ai-panel{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:18px;overflow:hidden}
.ai-hdr{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;background:#faf5ff;border-bottom:1px solid #ede9fe}
.ai-hdr-title{font-size:14px;font-weight:700;color:#5b21b6;display:flex;align-items:center;gap:8px}
.ai-btn{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.ai-btn:disabled{opacity:.5;cursor:default}
.ai-body{padding:18px 20px}
.ai-hint{color:#aaa;font-size:13px;text-align:center;padding:12px}
/* Spinner */
.spin-wrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:24px;color:#7c3aed;font-size:13px;font-weight:600}
.spinner{width:22px;height:22px;border:3px solid #ede9fe;border-top-color:#7c3aed;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Score */
.score-box{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:10px;margin-bottom:16px;font-weight:700}
.score-box.good{background:#f0fdf4;color:#15803d}
.score-box.warn{background:#fffbeb;color:#b45309}
.score-box.crit{background:#fff1f2;color:#be123c}
.score-num{font-size:38px;font-weight:900;line-height:1}
.score-lbl{font-size:11px;opacity:.75;margin-top:3px;font-weight:400}
/* Risk cards */
.risk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:16px}
.rc{border-radius:9px;padding:13px 15px;border-left:5px solid #ccc}
.rc.critical{border-color:#dc2626;background:#fff5f5}
.rc.high{border-color:#f97316;background:#fff7ed}
.rc.medium{border-color:#f59e0b;background:#fffbeb}
.rc.low{border-color:#22c55e;background:#f0fdf4}
.rc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rc-name{font-size:13px;font-weight:700;color:#1e293b}
.rl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.rl.critical{color:#dc2626}.rl.high{color:#ea580c}.rl.medium{color:#d97706}.rl.low{color:#16a34a}
.rc-detail{font-size:12px;color:#64748b;line-height:1.45}
.rc-action{margin-top:7px;font-size:12px;color:#1e40af;font-weight:600;background:#eff6ff;padding:5px 9px;border-radius:5px}
/* Suggestions */
.sugg-title{font-size:13px;font-weight:700;color:#374151;margin-bottom:9px}
.sugg-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.si{display:flex;gap:10px;padding:9px 13px;background:#f8fafc;border-radius:7px;border:1px solid #e2e8f0;font-size:13px}
.sn{background:#4f46e5;color:#fff;border-radius:50%;width:19px;height:19px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px}
/* Card */
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:18px;overflow:hidden}
.card-hdr{padding:13px 18px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.card-hdr-left{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.cnt-badge{background:#f0f0f0;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:700;color:#555}
.card-body{max-height:320px;overflow-y:auto}
/* Table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f8f9fa;padding:8px 11px;text-align:left;font-weight:700;color:#555;font-size:11px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0;border-bottom:2px solid #e9ecef}
td{padding:7px 11px;border-bottom:1px solid #f4f4f4;vertical-align:middle}
tr:hover td{background:#fafbff}
/* Badges */
.b{display:inline-block;padding:2px 8px;border-radius:9px;font-size:11px;font-weight:700}
.bg{background:#e8f5e9;color:#2e7d32}.br{background:#ffebee;color:#c62828}
.bo{background:#fff3e0;color:#e65100}.bb{background:#e3f2fd;color:#1565c0}
.bgy{background:#f5f5f5;color:#757575}.bp{background:#f3e5f5;color:#6a1b9a}
.bt{background:#e0f2f1;color:#00695c}
/* Summary */
.summary{background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff;border-radius:14px;padding:22px 26px;margin-bottom:24px}
.summary h2{font-size:15px;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.15)}
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sb{background:rgba(255,255,255,.07);border-radius:9px;padding:14px;border:1px solid rgba(255,255,255,.1)}
.sb h3{font-size:12px;font-weight:700;margin-bottom:9px;opacity:.9}
.sb ul{list-style:none}
.sb li{font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.07);display:flex;gap:7px;line-height:1.4}
.sb li:last-child{border:none}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}
.dr{background:#f44336}.do{background:#ff9800}.dg{background:#4caf50}.db{background:#64b5f6}
/* 2 col layout */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.empty{text-align:center;padding:24px;color:#bbb;font-size:13px}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
.today{font-size:12px;opacity:.65}
</style>

function b(txt,cls){ return '<span class="b '+cls+'">'+txt+'</span>'; }

function buildPage(loc, d){
  var activeBat=0, closedBat=0, enrolled=0, certified=0, assessed=0;
  d.batches.forEach(function(r){
    if(r['Status']==='Active') activeBat++;
    if(r['Status']==='Closed') closedBat++;
    enrolled  += parseInt(r['Enrolled'])||0;
    certified += parseInt(r['Certified'])||0;
    assessed  += parseInt(r['Assessed'])||0;
  });
  var certTrainers=0;
  d.trainers.forEach(function(t){ if(t['Certified (Y/N)']&&t['Certified (Y/N)'].toLowerCase()==='yes') certTrainers++; });
  var bgSub=0, bgPend=0;
  d.bg.forEach(function(r){ if(r['BG Status']==='Submitted') bgSub++; else if(r['BG Status']==='Not Submitted') bgPend++; });

  var kpi = '<div class="kpi-row">'
    +'<div class="kpi c-blue"><div class="kv c-blue">'+activeBat+'</div><div class="kl">Active Batches</div></div>'
    +'<div class="kpi c-teal"><div class="kv c-teal">'+closedBat+'</div><div class="kl">Closed Batches</div></div>'
    +'<div class="kpi c-green"><div class="kv c-green">'+enrolled+'</div><div class="kl">Total Enrolled</div></div>'
    +'<div class="kpi c-purple"><div class="kv c-purple">'+certTrainers+'/'+d.trainers.length+'</div><div class="kl">Trainers Certified</div></div>'
    +'<div class="kpi c-lime"><div class="kv c-lime">'+bgSub+'</div><div class="kl">BG Submitted</div></div>'
    +'<div class="kpi c-red"><div class="kv c-red">'+bgPend+'</div><div class="kl">BG Pending</div></div>'
    +'</div>';

  var alerts = buildAlerts(d);
  var alertHtml = '<div class="sec-title" style="color:#c0392b">⚡ Important Action Items</div><div class="alerts">';
  if(alerts.length===0) alertHtml += '<p style="color:#aaa;font-size:13px">✅ No urgent action items for this location.</p>';
  else alerts.forEach(function(a){ alertHtml += '<div class="alert '+a.lvl+'"><div class="alert-icon">'+a.icon+'</div><div><div class="alert-cat '+a.lvl+'">'+a.cat+'</div><div class="alert-msg">'+a.msg+'</div></div></div>'; });
  alertHtml += '</div>';

  var aiPanel = '<div class="ai-panel"><div class="ai-hdr"><div class="ai-hdr-title">🤖 Risk Analysis &amp; Suggestions</div>'
    +'<button class="ai-btn" id="aiBtn" onclick="doAnalysis(\''+loc+'\')">🔍 Analyze Risk</button></div>'
    +'<div class="ai-body"><div class="ai-hint" id="aiResult">Click <b>Analyze Risk</b> to get instant risk assessment and action suggestions.</div></div></div>';

  return kpi + aiPanel + alertHtml + buildBatches(d) + buildTrainers(d) + buildAssessment(d) + buildBG(d) + buildAA(d) + buildInfra(d) + buildIT(d) + buildSummary(loc,d);
}

function buildAlerts(d){
  var today = new Date(); var alerts = [];
  // Trainer not certified
  var notCert = d.trainers.filter(function(t){ var v=t['Certified (Y/N)']; return !v||v==='-'||v.toLowerCase()==='no'; });
  if(notCert.length>0) alerts.push({lvl:'high',icon:'🚨',cat:'TRAINER (TOT)',msg:notCert.length+' trainer(s) not certified: '+notCert.map(function(t){return t['Name'];}).join(', ')});
  // Trainer expiring 180d
  var tExp = d.trainers.filter(function(t){
    if(!t['Valid Upto']||t['Valid Upto']==='-') return false;
    var p=t['Valid Upto'].split('/'); if(p.length!==3) return false;
    var d2=new Date(p[2]+'-'+p[1]+'-'+p[0]); var diff=(d2-today)/86400000; return diff>0&&diff<180;
  });
  if(tExp.length>0) alerts.push({lvl:'medium',icon:'⏰',cat:'TRAINER (TOT)',msg:tExp.length+' trainer certificate(s) expiring within 6 months: '+tExp.map(function(t){return t['Name'];}).join(', ')});
  // BG not submitted
  var bgNS = d.bg.filter(function(r){return r['BG Status']==='Not Submitted';});
  if(bgNS.length>0) alerts.push({lvl:'high',icon:'🚨',cat:'BANK GUARANTEE',msg:bgNS.length+' BG(s) NOT submitted — Work Order(s): '+bgNS.map(function(r){return r['Work Order'];}).join(', ')});
  // BG expiring 90d
  var bgExp = d.bg.filter(function(r){
    if(!r['BG Expiry Date']||r['BG Expiry Date']==='-') return false;
    var diff=(new Date(r['BG Expiry Date'])-today)/86400000; return diff>0&&diff<90;
  });
  if(bgExp.length>0) alerts.push({lvl:'medium',icon:'⏰',cat:'BANK GUARANTEE',msg:bgExp.length+' BG(s) expiring within 90 days — initiate renewal'});
  // AA expiring 180d
  var aaExp = d.aa.filter(function(a){
    if(!a['To']||a['To']==='-') return false;
    var diff=(new Date(a['To'])-today)/86400000; return diff>0&&diff<180;
  });
  if(aaExp.length>0) alerts.push({lvl:'medium',icon:'⏰',cat:'ACCREDITATION (A&A)',msg:aaExp.length+' accreditation(s) expiring within 6 months'});
  // AA expired
  var aaExpd = d.aa.filter(function(a){ if(!a['To']||a['To']==='-') return false; return new Date(a['To'])<today; });
  if(aaExpd.length>0) alerts.push({lvl:'high',icon:'🚨',cat:'ACCREDITATION (A&A)',msg:aaExpd.length+' accreditation(s) EXPIRED — immediate renewal required'});
  // Assessment pending
  var asgPend = d.assessment.filter(function(a){ return (parseInt(a['Assessed'])||0)===0&&(parseInt(a['Enrolled'])||0)>0; });
  if(asgPend.length>0) alerts.push({lvl:'medium',icon:'⏳',cat:'ASSESSMENT PENDING',msg:asgPend.length+' batch(es) enrolled but assessment not yet conducted'});
  // Active batches
  var actB = d.batches.filter(function(r){return r['Status']==='Active';});
  if(actB.length>0) alerts.push({lvl:'info',icon:'ℹ️',cat:'ACTIVE BATCHES',msg:actB.length+' batch(es) currently active — schedule assessment on time'});
  // Unused BG target
  var unused = d.bg.filter(function(r){return (parseInt(r['Used Target'])||0)===0&&(parseInt(r['Target'])||0)>0;});
  if(unused.length>0) alerts.push({lvl:'info',icon:'ℹ️',cat:'BG TARGET',msg:unused.length+' Work Order(s) have unused target (0 enrolled) — activate soon'});
  return alerts;
}

function doAnalysis(loc){
  var btn = document.getElementById('aiBtn');
  var res = document.getElementById('aiResult');
  if(!btn||!res) return;
  btn.disabled = true;
  btn.textContent = '⏳ Analyzing...';
  res.innerHTML = '<div class="spin-wrap"><div class="spinner"></div>Analyzing compliance data...</div>';

  setTimeout(function(){
    try {
      var d = DB.data[loc];
      var today = new Date();
      var risks = [], suggestions = [], score = 100;

      var totNo = d.trainers.filter(function(t){ var v=t['Certified (Y/N)']; return !v||v==='-'||v.toLowerCase()==='no'; }).length;
      var totExp90 = d.trainers.filter(function(t){
        if(!t['Valid Upto']||t['Valid Upto']==='-') return false;
        var p=t['Valid Upto'].split('/'); if(p.length!==3) return false;
        var diff=(new Date(p[2]+'-'+p[1]+'-'+p[0])-today)/86400000; return diff>0&&diff<90;
      }).length;
      var bgNot  = d.bg.filter(function(r){return r['BG Status']==='Not Submitted';}).length;
      var bgExp90= d.bg.filter(function(r){
        if(!r['BG Expiry Date']||r['BG Expiry Date']==='-') return false;
        var diff=(new Date(r['BG Expiry Date'])-today)/86400000; return diff>0&&diff<90;
      }).length;
      var aaExpd = d.aa.filter(function(a){ if(!a['To']||a['To']==='-') return false; return new Date(a['To'])<today; }).length;
      var aaExp  = d.aa.filter(function(a){
        if(!a['To']||a['To']==='-') return false;
        var diff=(new Date(a['To'])-today)/86400000; return diff>0&&diff<180;
      }).length;
      var asgPend= d.assessment.filter(function(a){ return (parseInt(a['Assessed'])||0)===0&&(parseInt(a['Enrolled'])||0)>0; }).length;
      var invNotElig = d.assessment.filter(function(a){ return a['Status']==='Not Eligible'&&(parseInt(a['Assessed'])||0)>0; }).length;
      var enrolled  = d.batches.reduce(function(s,r){return s+(parseInt(r['Enrolled'])||0);},0);
      var certified = d.batches.reduce(function(s,r){return s+(parseInt(r['Certified'])||0);},0);
      var certPct = enrolled>0 ? Math.round(certified/enrolled*100) : 100;

      if(aaExpd>0){score-=aaExpd*12; risks.push({category:'Accreditation Expired',level:'critical',detail:aaExpd+' A&A accreditation(s) already expired',action:'Apply for emergency A&A renewal on SDMS portal immediately'});}
      if(totNo>0){score-=totNo*8; risks.push({category:'Trainer Certification',level:'critical',detail:totNo+' trainer(s) not certified or cert missing',action:'Enroll in TOT program and upload certificate on SDMS portal without delay'});}
      if(bgNot>0){score-=bgNot*10; risks.push({category:'Bank Guarantee Not Submitted',level:'critical',detail:bgNot+' BG(s) not submitted to JSSDM',action:'Submit BG documents to district office immediately'});}
      if(aaExp>0){score-=aaExp*6; risks.push({category:'Accreditation Expiring',level:'high',detail:aaExp+' A&A accreditation(s) expiring within 6 months',action:'Apply for A&A renewal on SDMS portal before expiry'});}
      if(bgExp90>0){score-=bgExp90*5; risks.push({category:'BG Expiry Soon',level:'high',detail:bgExp90+' BG(s) expiring within 90 days',action:'Contact bank for renewal and submit fresh BG to JSSDM'});}
      if(asgPend>0){score-=asgPend*5; risks.push({category:'Assessment Not Done',level:'high',detail:asgPend+' batch(es) enrolled but assessment not conducted',action:'Contact assessment agency to schedule assessment dates'});}
      if(totExp90>0){score-=totExp90*4; risks.push({category:'Trainer Cert Expiry',level:'medium',detail:totExp90+' trainer certificate(s) expiring within 90 days',action:'Apply for TOT renewal at least 30 days before expiry'});}
      if(invNotElig>0){score-=invNotElig*3; risks.push({category:'Invoice Not Eligible',level:'medium',detail:invNotElig+' assessed batch(es) marked invoice not eligible',action:'Verify candidate data on SDMS and re-check invoice eligibility'});}
      if(certPct<60&&enrolled>0){score-=8; risks.push({category:'Low Certification Rate',level:'medium',detail:'Certification rate '+certPct+'% ('+certified+'/'+enrolled+') below 60% benchmark',action:'Conduct remedial training and arrange re-assessment for failed candidates'});}
      if(risks.length===0) risks.push({category:'Compliance Status',level:'low',detail:'No major compliance issues detected',action:'Continue monthly compliance reviews and timely renewals'});

      score = Math.max(10,Math.min(100,score));
      var st = score>=75?'Good':score>=50?'Warning':'Critical';
      var sumText = score>=75?'This location is in good compliance standing with minor items to monitor.':score>=50?'Moderate compliance gaps found. Immediate action needed on highlighted items.':'Critical compliance issues detected. Multiple urgent items require resolution now.';

      if(aaExpd>0) suggestions.push('URGENT: Renew '+aaExpd+' expired A&A accreditation(s) — center operations may be halted');
      if(totNo>0)  suggestions.push('Get '+totNo+' uncertified trainer(s) TOT certified — this is a compliance blocker');
      if(bgNot>0)  suggestions.push('Submit '+bgNot+' pending Bank Guarantee(s) to district office without further delay');
      if(asgPend>0) suggestions.push('Schedule assessment for '+asgPend+' batch(es) where candidates are enrolled but not yet assessed');
      if(aaExp>0)  suggestions.push('Initiate renewal for '+aaExp+' A&A accreditation(s) expiring within 6 months');
      if(bgExp90>0) suggestions.push('Begin BG renewal for '+bgExp90+' BG(s) expiring in 90 days — bank processing takes 7-10 working days');
      if(totExp90>0) suggestions.push('Apply for TOT renewal for '+totExp90+' trainer(s) before certificate expiry');
      if(certPct<60&&enrolled>0) suggestions.push('Improve certification rate from '+certPct+'% — conduct mock tests and remedial sessions');
      if(suggestions.length===0) suggestions.push('All major compliance items are in order — continue monthly reviews');
      suggestions.push('Upload all trainer attendance and candidate documents to SDMS portal regularly');

      var scoreClass = score>=75?'good':score>=50?'warn':'crit';
      var scoreEmoji = score>=75?'✅':score>=50?'⚠️':'🚨';
      var html = '<div class="score-box '+scoreClass+'"><div class="score-num">'+scoreEmoji+' '+score+'</div><div><div style="font-size:15px;font-weight:800">'+st+' — Compliance Score</div><div class="score-lbl">'+sumText+'</div></div></div>';
      html += '<div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:10px">🎯 Risk Assessment by Category</div>';
      html += '<div class="risk-grid">';
      risks.forEach(function(r){
        html += '<div class="rc '+r.level+'"><div class="rc-top"><span class="rc-name">'+r.category+'</span><span class="rl '+r.level+'">'+r.level.toUpperCase()+'</span></div><div class="rc-detail">'+r.detail+'</div><div class="rc-action">→ '+r.action+'</div></div>';
      });
      html += '</div>';
      html += '<div class="sugg-title">💡 Recommended Actions (Priority Order)</div><ul class="sugg-list">';
      suggestions.slice(0,5).forEach(function(s,i){
        html += '<li class="si"><span class="sn">'+(i+1)+'</span><span>'+s+'</span></li>';
      });
      html += '</ul>';
      res.innerHTML = html;
    } catch(e) {
      res.innerHTML = '<div style="color:red;padding:16px">Error: '+e.message+'</div>';
    }
    btn.disabled = false;
    btn.textContent = '🔍 Analyze Risk';
  }, 500);
}

function buildBatches(d){
  if(!d.batches.length) return card('📦 Batch Details',0,'<div class="empty">No batch data</div>');
  var t = '<table><thead><tr><th>Batch ID</th><th>Job Role</th><th>Start</th><th>End</th><th>Status</th><th>Enrolled</th><th>Assessed</th><th>Certified</th><th>Work Order</th></tr></thead><tbody>';
  d.batches.forEach(function(r){
    var st = r['Status']==='Active'?'<span class="b bg">Active</span>':'<span class="b bgy">Closed</span>';
    t += '<tr><td style="font-family:monospace;font-size:11px">'+r['Batch Id']+'</td><td>'+r['Job Role']+'</td><td>'+r['Batch Start Date']+'</td><td>'+r['Batch End Date']+'</td><td>'+st+'</td><td><b>'+r['Enrolled']+'</b></td><td>'+r['Assessed']+'</td><td>'+r['Certified']+'</td><td style="font-family:monospace;font-size:11px">'+r['Work Order No']+'</td></tr>';
  });
  return card('📦 Batch Details', d.batches.length, t+'</tbody></table>');
}

function buildTrainers(d){
  if(!d.trainers.length) return card('👨‍🏫 Trainers (TOT)',0,'<div class="empty">No trainer data</div>');
  var t = '<table><thead><tr><th>Name</th><th>TR ID</th><th>Job Role</th><th>Certified</th><th>Issue Date</th><th>Valid Upto</th><th>Status</th></tr></thead><tbody>';
  d.trainers.forEach(function(r){
    var cv = r['Certified (Y/N)'];
    var cb = cv&&cv.toLowerCase()==='yes' ? b('Certified','bg') : b('Not Certified','br');
    t += '<tr><td><b>'+r['Name']+'</b></td><td style="font-family:monospace;font-size:11px">'+r['State TR ID']+'</td><td>'+r['Job role']+'</td><td>'+cb+'</td><td>'+r['Issue Date']+'</td><td>'+r['Valid Upto']+'</td><td>'+r['Status']+'</td></tr>';
  });
  return card('👨‍🏫 Trainers (TOT)', d.trainers.length, t+'</tbody></table>');
}

function buildAssessment(d){
  if(!d.assessment.length) return card('📝 Assessment',0,'<div class="empty">No assessment data</div>');
  var t = '<table><thead><tr><th>Batch ID</th><th>Job Role</th><th>Enrolled</th><th>Assessed</th><th>Certified</th><th>Assess Date</th><th>Invoice Status</th></tr></thead><tbody>';
  d.assessment.forEach(function(r){
    var assessed = parseInt(r['Assessed'])||0;
    var enrolled = parseInt(r['Enrolled'])||0;
    var s = r['Status'];
    var sb;
    if(s==='Y') sb = b('Invoice Eligible','bg');
    else if(assessed===0&&enrolled>0) sb = b('Assessment Pending','bb');
    else sb = b('Invoice Not Eligible','bo');
    var ac = assessed===0 ? 'style="color:#f97316;font-weight:700"' : 'style="color:#16a34a;font-weight:700"';
    t += '<tr><td style="font-family:monospace;font-size:11px">'+r['Batch Id']+'</td><td>'+r['Job Role']+'</td><td>'+enrolled+'</td><td '+ac+'>'+assessed+'</td><td>'+r['Certified']+'</td><td>'+r['Date of Assessment']+'</td><td>'+sb+'</td></tr>';
  });
  return card('📝 Assessment Status', d.assessment.length, t+'</tbody></table>');
}

function buildBG(d){
  if(!d.bg.length) return card('🏦 Bank Guarantee (BG)',0,'<div class="empty">No BG data</div>');
  var t = '<table><thead><tr><th>Job Role</th><th>Work Order</th><th>BG Amount</th><th>BG Number</th><th>Issue Date</th><th>Expiry Date</th><th>Target</th><th>Used</th><th>Status</th></tr></thead><tbody>';

}

function buildInfra(d){

function buildIT(d){

  var aaExpir = d.aa.filter(function(a){
    if(!a['To']||a['To']==='-') return false;
    var diff=(new Date(a['To'])-today)/86400000; return diff>0&&diff<180;
  });
  var actB    = d.batches.filter(function(r){return r['Status']==='Active';});
  var clsB    = d.batches.filter(function(r){return r['Status']==='Closed';});
  var asgPend = d.assessment.filter(function(a){ return (parseInt(a['Assessed'])||0)===0&&(parseInt(a['Enrolled'])||0)>0; });

  function dot(c,txt){ return '<li><span class="dot '+c+'"></span>'+txt+'</li>'; }

  var tHTML = (notCert.length>0 ? dot('dr',notCert.length+' trainer(s) not certified — urgent') : '')
    +(tExp.length>0 ? dot('do',tExp.length+' cert(s) expiring in 6 months') : '')
    +(certOk.length>0 ? dot('dg',certOk.length+' trainer(s) certified ✓') : dot('do','No certified trainers found'));

  var iHTML = dot('db','Submit Milestone invoice after assessment completion')
    +dot('do','Check rejected invoices and re-submit with corrections')

    +(clsB.length>0 ? dot('db',clsB.length+' batch(es) closed') : '')
    +(asgPend.length>0 ? dot('dr',asgPend.length+' batch(es) assessment pending') : '')
    +dot('do','Schedule assessment timely for active batches');

  var bgHTML = (bgNS.length>0 ? dot('dr',bgNS.length+' BG(s) NOT submitted — submit immediately') : '')
    +(bgExp.length>0 ? dot('do',bgExp.length+' BG(s) expiring in 6 months — renew') : '')
    +(bgSub.length>0 ? dot('dg',bgSub.length+' BG(s) submitted ✓') : '')
    +(aaExpd.length>0 ? dot('dr','A&A: '+aaExpd.length+' accreditation(s) expired!') : '')
    +(aaExpir.length>0 ? dot('do','A&A: '+aaExpir.length+' expiring in 6 months') : '')
    +(aaExpd.length===0&&aaExpir.length===0 ? dot('dg','All A&A accreditations valid ✓') : '');

  return '<div class="summary"><h2>📋 Action Summary — '+loc+'</h2><div class="sum-grid">'
    +'<div class="sb"><h3>👨‍🏫 Trainer (TOT)</h3><ul>'+tHTML+'</ul></div>'
    +'<div class="sb"><h3>🧾 Invoice</h3><ul>'+iHTML+'</ul></div>'
    +'<div class="sb"><h3>📦 Batch Status</h3><ul>'+bHTML+'</ul></div>'
    +'<div class="sb"><h3>🏦 BG & A&A Risk</h3><ul>'+bgHTML+'</ul></div>'
    +'</div></div>';
}

function card(title, count, body){
  return '<div class="card"><div class="card-hdr"><div class="card-hdr-left">'+title+'<span class="cnt-badge">'+count+'</span></div></div><div class="card-body">'+body+'</div></div>';
}
</script>
</body>
</html>
